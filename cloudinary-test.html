<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teste Cloudinary</title>
    <style>
      :root { color-scheme: dark; font-family: Arial, sans-serif; background: #0a0a0b; color: #f4f2ee; }
      body { max-width: 720px; margin: 0 auto; padding: 40px 20px; }
      form { display: grid; gap: 16px; padding: 24px; border: 1px solid #333; border-radius: 12px; background: #151517; }
      input, button { font: inherit; padding: 12px; border-radius: 8px; }
      input { border: 1px solid #444; background: #0d0d0e; color: inherit; }
      button { border: 0; cursor: pointer; background: #f4f2ee; color: #111; font-weight: 700; }
      button:disabled { cursor: wait; opacity: 0.6; }
      pre { white-space: pre-wrap; overflow-wrap: anywhere; padding: 16px; border: 1px solid #333; border-radius: 8px; background: #111; }
      .result { margin-top: 24px; }
      .error { color: #f0aaaa; }
    </style>
  </head>
  <body>
    <h1>Teste de upload Cloudinary</h1>
    <form id="upload-form">
      <label for="video">Selecione um video</label>
      <input id="video" name="video" type="file" accept="video/mp4,video/quicktime,video/webm" required />
      <button id="submit" type="submit">Testar Upload</button>
    </form>

    <section class="result" aria-live="polite">
      <p><strong>HTTP status:</strong> <span id="status">Aguardando teste.</span></p>
      <p><strong>Resposta completa:</strong></p>
      <pre id="response">Nenhuma resposta ainda.</pre>
      <p><strong>URL retornada:</strong> <span id="url">Nenhuma.</span></p>
    </section>

    <script>
      const form = document.getElementById('upload-form');
      const fileInput = document.getElementById('video');
      const button = document.getElementById('submit');
      const statusOutput = document.getElementById('status');
      const responseOutput = document.getElementById('response');
      const urlOutput = document.getElementById('url');
      const endpoint = 'https://api.cloudinary.com/v1_1/kmpdippzz/video/upload';

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const file = fileInput.files[0];
        if (!file) return;

        const data = new FormData();
        data.append('file', file);
        data.append('upload_preset', 'portfolio_unsigned');

        button.disabled = true;
        statusOutput.textContent = 'Enviando...';
        responseOutput.textContent = 'Aguardando resposta...';
        urlOutput.textContent = 'Nenhuma.';

        const request = new XMLHttpRequest();
        request.open('POST', endpoint);
        request.responseType = 'text';
        request.addEventListener('load', () => {
          statusOutput.textContent = request.status + ' ' + request.statusText;
          responseOutput.textContent = request.responseText || '(resposta vazia)';
          try {
            const response = JSON.parse(request.responseText);
            urlOutput.textContent = response.secure_url || '(nenhuma secure_url)';
          } catch {
            urlOutput.textContent = '(resposta nao JSON)';
          }
          button.disabled = false;
        });
        request.addEventListener('error', () => {
          statusOutput.textContent = 'Erro de rede';
          responseOutput.textContent = 'Nao foi possivel concluir a requisicao.';
          urlOutput.textContent = 'Nenhuma.';
          button.disabled = false;
        });
        request.send(data);
      });
    </script>
  </body>
</html>
